  DB_NAME: triage
  DB_USER: triage
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP: kafka:9092
  TRIAGE_SLA_EVALUATION_INTERVAL: 30s
  LLM_EMBEDDING_MODEL: nvidia/nemotron-3.5-embed-1b:free
  ASSISTANT_RAG_SIMILARITY_THRESHOLD: "0.40"
