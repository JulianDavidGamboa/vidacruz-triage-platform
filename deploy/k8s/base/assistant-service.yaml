apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assistant-service
          image: vidacruz/assistant-service:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vidacruz-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: API_KEY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: LLM_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
spec:
  selector:
    app.kubernetes.io/name: assistant-service
  ports:
    - name: http
      port: 80
      targetPort: http
