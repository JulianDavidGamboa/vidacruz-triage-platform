#   docker compose -f deploy/docker/docker-compose.yml --env-file .env up --build
name: vidacruz

x-java-service: &java-service
  restart: unless-stopped
  networks: [vidacruz]

services:
  # ───────────── Infraestructura ─────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: ${DB_USER:-triage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-triage} -d triage"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [vidacruz]

  kafka:
    image: apache/kafka:3.9.0 # KRaft: sin ZooKeeper
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [vidacruz]

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic triaje.eventos --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic triaje.eventos.dlt --partitions 1 --replication-factor 1
    restart: "no"
    networks: [vidacruz]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [vidacruz]

  # ───────────── Servicios ─────────────
  triage-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: triage-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_NAME: triage
      DB_USER: ${DB_USER:-triage}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      API_KEY: ${API_KEY:?Define API_KEY en .env}
      # Para probar el escalamiento sin esperar: TRIAGE_SLA_EVALUATION_INTERVAL=5s
      TRIAGE_SLA_EVALUATION_INTERVAL: ${TRIAGE_SLA_EVALUATION_INTERVAL:-30s}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  assistant-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: assistant-service
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      API_KEY: ${API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:?Define LLM_API_KEY en .env}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  alert-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: alert-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      # Vacío → el servicio usa el canal de respaldo (log)
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  vidacruz:

volumes:
  pgdata:
  kafkadata:
  redisdata:
