spring:
  application:
    name: triage-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:triage}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:                         # Flyway no usa R2DBC: necesita su propia URL JDBC
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:triage}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness y /readiness

logging:
  structured:
    format:
      console: logstash           # logs JSON nativos de Spring Boot 3.4+

triage:
  api-key: ${API_KEY}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    topic: triaje.eventos
  outbox:
    poll-interval: 500ms
    batch-size: 100
  sla:
    minutos:                      # la clave es el nombre exacto del enum
      CRITICO: 5
      URGENTE: 10
      URGENTE_2: 30
      NO_URGENTE: 60
      NO_URGENTE_2: 120
