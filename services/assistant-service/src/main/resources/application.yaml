spring:
  application:
    name: assistant-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://openrouter.ai/api}
      api-key: ${LLM_API_KEY:}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:openrouter/free}
          temperature: 0
      embedding:
        options:
          model: ${LLM_EMBEDDING_MODEL:nvidia/llama-nemotron-embed-vl-1b-v2:free}

assistant:
  api-key: ${API_KEY:}
  rag:
    top-k: 3
    similarity-threshold: 0.75
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    topic: triaje.eventos
  mensajeria:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
